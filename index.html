<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; background: #f5f5f5; }
    .container { max-width: 400px; margin: 0 auto; background: white; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; }
    .title { font-size: 24px; font-weight: bold; }
    .caption { padding: 20px; }
    .caption-head { font-size: 12px; color: #666; }
    .caption-main { font-size: 28px; font-weight: bold; margin-top: 10px; line-height: 1.3; }
    .info { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; border-top: 1px solid #eee; }
    .info-item { display: flex; gap: 10px; }
    .info-label { font-size: 12px; color: #666; display: block; }
    .gallery { display: grid; gap: 12px; padding: 0 12px 12px; }
    .gallery img, .gallery video { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #f0f0f0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="title">Ben</span>
    </div>
    
    <div class="gallery">
      <img src="IMG_8682.jpeg" alt="">
      <div class="caption">
        <div class="caption-head">My Green Flags</div>
        <div class="caption-main">test<br>test</div>
      </div>

      <div class="info">
        <div class="info-item">🧁 <span class="info-label">28</span></div>
        <div class="info-item">📏 <span class="info-label">6'0"</span></div>
        <div class="info-item">💼 <span class="info-label">Software Engineer</span></div>
        <div class="info-item">🎓 <span class="info-label">Texas Tech</span></div>
        <div class="info-item">📖 <span class="info-label">Catholic</span></div>
        <div class="info-item">🔍 <span class="info-label">Life partner</span></div>
      </div>

      <img src="IMG_8507.jpeg" alt="">
      <img src="IMG_8526.jpeg" alt="">
      <div class="caption">
        <div class="caption-head">I'm a big fan of</div>
        <div class="caption-main">The outdoors and people who love it!.. bonus points if you like overly complex board games</div>
      </div>
      <img src="IMG_5519.jpeg" alt="">
      <img src="IMG_9065.jpeg" alt="">
      <div class="caption">
        <div class="caption-head">I know the best spot in town for</div>
        <div class="caption-main">Hiking, climbing, biking, golfing, or axe throwing!</div>
      </div>
      <video src="IMG_9076.mov" autoplay muted loop playsinline></video>
    </div>
  </div>
</body>
</html>
